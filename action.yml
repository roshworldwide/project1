name: "holdout eval gate"
description: >-
  Run an LLM eval on this PR and fail only when quality regressed beyond
  statistical noise. Posts the full comparison (effects, confidence
  intervals, corrected p-values) as a PR comment.
branding:
  icon: "activity"
  color: "yellow"

inputs:
  eval:
    description: "Eval reference: a .jsonl file or Python 'module:attr'"
    required: true
  target:
    description: "Target reference: 'ollama:M' | 'openai:M' | 'anthropic:M' | 'module:attr'"
    required: true
  baseline:
    description: "Baseline run id (or unambiguous prefix) present in the store"
    required: true
  store:
    description: "Run store directory (commit your baseline artifact inside it)"
    required: false
    default: ".holdout"
  scorer:
    description: "Scorer for .jsonl evals: exact | exact-strict | regex:<pattern>"
    required: false
    default: "exact"
  alpha:
    description: "Significance level applied to corrected p-values"
    required: false
    default: "0.05"
  correction:
    description: "Multiple-comparison correction: benjamini-hochberg | holm | none"
    required: false
    default: "benjamini-hochberg"
  seed:
    description: "Seed for generation and resampling"
    required: false
    default: "0"
  python-version:
    description: "Python version to set up"
    required: false
    default: "3.12"
  install:
    description: "pip spec for holdout ('.' to install from this repo checkout)"
    required: false
    default: "holdout"
  comment:
    description: "Post the comparison as a PR comment"
    required: false
    default: "true"
  github-token:
    description: "Token used to post the PR comment"
    required: false
    default: ${{ github.token }}

outputs:
  run-id:
    description: "Run id of the candidate evaluation"
    value: ${{ steps.candidate.outputs.id }}
  verdict:
    description: "improved | regressed | no_significant_change | insufficient_data"
    value: ${{ steps.gate.outputs.verdict }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install holdout
      shell: bash
      run: python -m pip install --quiet --upgrade pip && python -m pip install --quiet "${{ inputs.install }}"

    - name: Run candidate eval
      id: candidate
      shell: bash
      run: |
        holdout --store "${{ inputs.store }}" run "${{ inputs.eval }}" \
          --target "${{ inputs.target }}" \
          --scorer "${{ inputs.scorer }}" \
          --seed "${{ inputs.seed }}" \
          --id-file "${RUNNER_TEMP}/holdout-run-id"
        echo "id=$(cat "${RUNNER_TEMP}/holdout-run-id")" >> "$GITHUB_OUTPUT"

    - name: Compare against baseline
      id: gate
      shell: bash
      run: |
        set +e
        holdout --store "${{ inputs.store }}" compare \
          "${{ inputs.baseline }}" "${{ steps.candidate.outputs.id }}" \
          --alpha "${{ inputs.alpha }}" \
          --correction "${{ inputs.correction }}" \
          --seed "${{ inputs.seed }}" \
          --markdown > "${RUNNER_TEMP}/holdout-comparison.md"
        code=$?
        set -e
        cat "${RUNNER_TEMP}/holdout-comparison.md" >> "$GITHUB_STEP_SUMMARY"
        case "$code" in
          0) verdict="no_significant_regression" ;;
          1) verdict="regressed" ;;
          2) verdict="insufficient_data" ;;
          *) verdict="error" ;;
        esac
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        echo "exit=$code" >> "$GITHUB_OUTPUT"

    - name: Post PR comment
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        gh pr comment "${{ github.event.pull_request.number }}" \
          --repo "$GITHUB_REPOSITORY" \
          --body-file "${RUNNER_TEMP}/holdout-comparison.md"

    - name: Gate
      shell: bash
      run: exit "${{ steps.gate.outputs.exit }}"
